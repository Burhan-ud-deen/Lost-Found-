<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Notifications for matches, messages, claims and returns on Lost and Found Citywide.">
  <title>Notifications — Lost &amp; Found Citywide</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="">

  <main id="main">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap">
      <div>
        <h1 class="page-title">Notifications</h1>
        <p class="page-sub">Updates about matches, messages, claims and returns on your reports.</p>
      </div>
      <button class="btn btn-outline" type="button" id="mark-all">Mark all read</button>
    </div>

    <ul class="notif-list" id="notif-list" aria-live="polite"></ul>
  </main>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    (function () {
      var ICONS = { info: '🔔', success: '✅', warn: '⚠️' };
      var listEl = document.getElementById('notif-list');
      var markBtn = document.getElementById('mark-all');

      function render() {
        var list = LF.getNotifications().slice().sort(function (a, b) {
          return (b.unread ? 1 : 0) - (a.unread ? 1 : 0);
        });

        if (!list.length) {
          markBtn.classList.add('hidden');
          listEl.innerHTML = '<li class="empty">' +
            '<div class="ico" aria-hidden="true">🔔</div>' +
            '<p>No notifications yet. Report an item or start a claim to get updates here.</p></li>';
          return;
        }

        markBtn.classList.remove('hidden');
        listEl.innerHTML = list.map(function (n) {
          var cls = 'notif';
          if (n.unread) cls += ' unread';
          if (n.kind === 'success' || n.kind === 'warn') cls += ' ' + n.kind;
          var icon = ICONS[n.kind] || ICONS.info;
          return '<li class="' + cls + '">' +
            '<span class="ico" aria-hidden="true">' + icon + '</span>' +
            '<div>' +
              '<h4>' + App.esc(n.title) + '</h4>' +
              '<p>' + App.esc(n.body) + '</p>' +
              '<time>' + App.esc(n.time) + '</time>' +
            '</div>' +
          '</li>';
        }).join('');
      }

      markBtn.addEventListener('click', function () {
        App.markNotificationsRead();
        render();
        App.toast('All notifications marked read');
      });

      render();
      App.markNotificationsRead();
    })();
  </script>
</body>
</html>
