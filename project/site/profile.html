<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="View and edit your Lost and Found Citywide profile.">
  <title>My profile — Lost &amp; Found Citywide</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="">

  <main id="main">
    <h1 class="page-title">My profile</h1>
    <p class="page-sub">Your account details. Data is stored in this browser only.</p>

    <div class="form-card" style="max-width:520px">
      <ul class="detail-list" id="profile-view"></ul>

      <hr style="border:none;border-top:1px solid var(--line);margin:22px 0 20px">

      <form id="profile-form" novalidate>
        <div class="field">
          <label for="p-name">Full name</label>
          <input id="p-name" name="name" type="text" autocomplete="name" required>
        </div>
        <div class="field">
          <label for="p-city">City</label>
          <input id="p-city" name="city" type="text" autocomplete="address-level2" required>
        </div>
        <div class="flex">
          <button class="btn btn-primary" type="submit">Save changes</button>
          <a class="btn btn-outline" href="dashboard.html">View my reports</a>
          <button class="btn btn-danger" type="button" id="logout-btn-profile">Log out</button>
        </div>
      </form>
    </div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    (function () {
      var user = App.requireUser();
      if (!user) return;

      var viewEl = document.getElementById('profile-view');
      var form = document.getElementById('profile-form');
      var nameInput = document.getElementById('p-name');
      var cityInput = document.getElementById('p-city');

      function renderView() {
        var u = LF.getUser() || user;
        var rows = [
          ['Name', App.esc(u.name)],
          ['Email', App.esc(u.email || '—')],
          ['City', App.esc(u.city || '—')],
          ['Member since', App.esc(u.savedAt || 'this session')]
        ].map(function (r) {
          return '<li><span class="k">' + r[0] + '</span><span class="v">' + r[1] + '</span></li>';
        }).join('');
        viewEl.innerHTML = rows;
        nameInput.value = u.name || '';
        cityInput.value = u.city || '';
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var name = nameInput.value.trim();
        var city = cityInput.value.trim();
        if (!name || !city) {
          App.toast('Name and city are required', 'error');
          return;
        }
        var current = LF.getUser() || user;
        var merged = {};
        for (var k in current) merged[k] = current[k];
        merged.name = name;
        merged.city = city;
        LF.setUser(merged);
        renderView();
        App.toast('Profile updated');
      });

      document.getElementById('logout-btn-profile').addEventListener('click', function () {
        LF.clearUser();
        App.go('index.html');
      });

      renderView();
    })();
  </script>
</body>
</html>
