<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lost Items — Lost &amp; Found Citywide</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="lost">

  <main id="main">
    <div class="flex flex-between" style="justify-content:space-between">
      <div>
        <h1 class="page-title">Lost items</h1>
        <p class="page-sub">Browse open reports from people who lost something. Think you found one? Start a claim from the item page.</p>
      </div>
      <a class="btn btn-primary" href="report-lost.html">I lost something</a>
    </div>

    <div id="browse-note" class="hidden"></div>

    <div class="flex mb-16" id="chip-row" aria-label="Quick filters">
      <span class="badge badge-lost">Lost</span>
      <span class="text-muted" style="font-size:.85rem" id="count-line" role="status" aria-live="polite"></span>
    </div>

    <section class="grid" id="lost-grid" aria-label="Lost item reports" aria-live="polite"></section>
  </main>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    (function () {
      var user = LF.getUser();
      if (!user) {
        var note = document.getElementById('browse-note');
        note.className = 'alert alert-info';
        note.innerHTML = 'Browsing works without an account. <a href="login.html">Log in</a> or <a href="login.html?mode=register">sign up</a> to report, claim, or message.';
      }

      var items = LF.getItems().filter(function (it) { return it.type === 'lost'; });
      document.getElementById('count-line').textContent = items.length + (items.length === 1 ? ' open report' : ' open reports');
      App.renderGrid(document.getElementById('lost-grid'), items, 'No lost items reported yet.');
    })();
  </script>
</body>
</html>
